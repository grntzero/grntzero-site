<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<script>/* 카카오톡 인앱 브라우저 → 외부 브라우저로 열기 */(function(){var u=navigator.userAgent||"";if(!/KAKAOTALK/.test(u)||/scrap|bot/i.test(u))return;var go=function(){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href)};try{if(!sessionStorage.getItem("gz_ext")){sessionStorage.setItem("gz_ext","1");go();}}catch(e){go()}document.addEventListener("DOMContentLoaded",function(){var b=document.createElement("div");b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#C6A35C;color:#0D0A06;font:600 14px/1.4 -apple-system,sans-serif;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between";b.innerHTML='<span>카카오톡 안에서는 일부 기능이 안 될 수 있어요</span><a style="flex:none;background:#0D0A06;color:#fff;padding:8px 12px;border-radius:4px;text-decoration:none" href="#">브라우저로 열기</a>';b.querySelector("a").addEventListener("click",function(e){e.preventDefault();go()});document.body.appendChild(b)})})();</script>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모션 시험</title>
<style>
:root{--bg:#050b16;--tx:#e6f0ff;--dim:#7d8fa8;--line:#1e3354}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px 'Apple SD Gothic Neo',sans-serif;overflow:hidden}
#top{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#07101fdd;z-index:5}
#home{font:600 15px ui-monospace,monospace;letter-spacing:.15em;cursor:pointer}
#top button{border:1px solid var(--line);background:#0a1426;color:var(--tx);border-radius:7px;padding:4px 10px;cursor:pointer}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#info{position:fixed;right:14px;top:60px;width:min(300px,80vw);background:#0a1426ee;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none;z-index:5}
#help{position:fixed;right:14px;bottom:14px;width:min(300px,80vw);color:var(--dim);font-size:12px;line-height:1.6;z-index:5;background:#0a1426cc;border-radius:10px;padding:8px 12px}
#help b{color:var(--tx)}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="top"><span id="home" role="button" tabindex="0">GRUNT·ZERO</span>
  <button type="button" onclick="document.getElementById('info').style.display='block';document.getElementById('it').textContent='열기 버튼 눌림'">열기</button>
  <button type="button" onclick="alertBox('보내기가 눌렸어요 — 이건 막혀야 정상')">📨 메일 보내기</button>
</div>
<div id="info"><b id="it"></b><p id="ib" style="color:var(--dim);margin:6px 0 0">✊ 주먹을 쥐면 닫힙니다</p></div>
<div id="help"><b>모션 시험</b> — 왼쪽 아래 「✋ 모션 켜기」<br>
✊ <b>주먹</b> 0.5초 → 본화면(선택·창 닫힘)<br>
✋✋ <b>두 손바닥 벌리기</b> → 확대 / 모으기 → 축소 / 같이 움직이면 이동<br>
👌 <b>엄지·검지 집기</b>(나머지 손가락은 펴기) → 그 자리 클릭<br>
📨 보내기 버튼은 손동작으로 안 눌려야 정상</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, nodes = [], sel = null;
function resize() {
  W = innerWidth; H = innerHeight; cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  nodes = []; const n = 8, cx = W / 2, cy = H / 2 + 10, R = Math.min(W, H) * 0.32;
  for (let i = 0; i < n; i++) nodes.push({ i: i + 1, x: cx + R * Math.cos(i / n * 6.283), y: cy + R * Math.sin(i / n * 6.283), r: Math.max(18, Math.min(W, H) * 0.045) });
}
let hover = null;
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#1e3354'; ctx.lineWidth = 1;
  for (const n of nodes) { ctx.beginPath(); ctx.moveTo(W / 2, H / 2 + 10); ctx.lineTo(n.x, n.y); ctx.stroke(); }
  ctx.fillStyle = '#7cc4ff'; ctx.beginPath(); ctx.arc(W / 2, H / 2 + 10, 26, 0, 6.283); ctx.fill();
  ctx.font = '12px ui-monospace,monospace'; ctx.textAlign = 'center';
  for (const n of nodes) {
    ctx.fillStyle = n === sel ? '#4fd18b' : n === hover ? '#b9d9ff' : '#3a6fb0';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#e6f0ff'; ctx.fillText('영역 ' + n.i, n.x, n.y + n.r + 16);
  }
  requestAnimationFrame(draw);
}
const hit = (x, y) => nodes.find(n => Math.hypot(n.x - x, n.y - y) < n.r + 8) || null;
cv.addEventListener('pointermove', e => { hover = hit(e.clientX, e.clientY); });
cv.addEventListener('click', e => { const n = hit(e.clientX, e.clientY); sel = n;
  const info = document.getElementById('info'); if (n) { document.getElementById('it').textContent = '선택: 영역 ' + n.i; info.style.display = 'block'; } else info.style.display = 'none'; });
function goHome() { sel = null; document.getElementById('info').style.display = 'none'; }
document.getElementById('home').onclick = goHome;
function alertBox(s) { document.getElementById('it').textContent = s; document.getElementById('info').style.display = 'block'; }
addEventListener('resize', resize); resize(); draw();
</script>
<script src="motion.js"></script>
</body></html>

<style>/* GRUNT 대시보드 A 디자인 (2026-10-28 대표 선택) — 사이버 + 스팀펑크, 깔끔하게
   황동 테두리 + 시안 네온 가는 선 + 짙은 남색 바탕. 녹·증기·잡동사니 없음.
   쓰는 법: <link rel="stylesheet" href="theme_A.css"> 후 아래 클래스·토큰 사용.
   아이콘: icons_A.svg 의 <symbol id="i-이름"> → <svg class="ic"><use href="icons_A.svg#i-mic"/></svg> */
:root {
  --a-bg: #050b14;          /* 바탕 — 남색에 가까운 검정 */
  --a-bg2: #0a1424;         /* 패널 바탕 */
  --a-grid: rgba(90, 160, 210, .06);
  --a-line: #16304a;        /* 일반 구분선 */
  --a-cyan: #3fe0ff;        /* 네온 시안 — 진행·선택 */
  --a-cyan-dim: rgba(63, 224, 255, .35);
  --a-brass: #c9a25a;       /* 황동 */
  --a-brass-hi: #ecd29a;    /* 황동 하이라이트 */
  --a-brass-lo: #7d5f2c;    /* 황동 그림자 */
  --a-amber: #f2a93b;       /* 대기·주의 */
  --a-red: #ff6b6b;         /* 오류 */
  --a-green: #4fd18b;       /* 완료 */
  --a-tx: #d8e6f2;          /* 글자 */
  --a-dim: #7d93ab;         /* 흐린 글자 */
  --a-font: 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif;
  --a-mono: ui-monospace, 'SF Mono', Menlo, monospace;
}

/* 바탕: 아주 옅은 격자 */
.a-bg {
  background-color: var(--a-bg);
  background-image:
    linear-gradient(var(--a-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--a-grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--a-tx);
  font-family: var(--a-font);
}

/* 황동 원형 베젤 (아이콘·영역 노드) — 눈금 4개 */
.a-bezel {
  --s: 44px;
  position: relative; width: var(--s); height: var(--s); border-radius: 50%;
  display: inline-grid; place-items: center;
  background: radial-gradient(circle at 50% 50%, #08131f 62%, transparent 63%),
              conic-gradient(from 200deg, var(--a-brass-lo), var(--a-brass-hi), var(--a-brass), var(--a-brass-lo), var(--a-brass-hi), var(--a-brass-lo));
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .5);
  color: var(--a-cyan);
}
.a-bezel::before { /* 눈금 */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background:
    linear-gradient(var(--a-brass-hi), var(--a-brass-hi)) 50% 0 / 1px 5px no-repeat,
    linear-gradient(var(--a-brass-hi), var(--a-brass-hi)) 50% 100% / 1px 5px no-repeat,
    linear-gradient(var(--a-brass-hi), var(--a-brass-hi)) 0 50% / 5px 1px no-repeat,
    linear-gradient(var(--a-brass-hi), var(--a-brass-hi)) 100% 50% / 5px 1px no-repeat;
  opacity: .8; pointer-events: none;
}
.a-bezel.on { box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 14px var(--a-cyan-dim); }
.a-bezel.wait { color: var(--a-amber); }
.a-bezel.err { color: var(--a-red); }
.a-bezel.done { color: var(--a-green); }

/* 아이콘 (선 아이콘, 색은 currentColor + 은은한 빛) */
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 3px currentColor); }
.a-bezel .ic { width: calc(var(--s) * .5); height: calc(var(--s) * .5); }

/* 패널: 황동 모서리 꺾쇠만 (테두리 전체를 두르지 않음) */
.a-panel {
  position: relative; background: rgba(10, 20, 36, .82); border: 1px solid var(--a-line); border-radius: 6px; padding: 12px 14px;
  backdrop-filter: blur(6px);
}
.a-panel::before, .a-panel::after { content: ""; position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--a-brass); pointer-events: none; }
.a-panel::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.a-panel::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }

/* 윗줄: 가는 황동 선 */
.a-top { border-bottom: 1px solid var(--a-brass-lo); box-shadow: 0 1px 0 rgba(236, 210, 154, .08); }
.a-tab { color: var(--a-dim); letter-spacing: .12em; font: 600 12px var(--a-mono); padding: 6px 2px; border-bottom: 2px solid transparent; }
.a-tab.on { color: var(--a-tx); border-bottom-color: var(--a-cyan); }

/* 버튼 */
.a-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--a-brass-lo); background: #0a1426; color: var(--a-tx);
         border-radius: 7px; padding: 5px 11px; font: 13px var(--a-font); cursor: pointer; white-space: nowrap; }
.a-btn:hover { border-color: var(--a-brass); }
.a-btn:focus-visible { outline: 2px solid var(--a-cyan); outline-offset: 2px; }
.a-btn .ic { width: 16px; height: 16px; }

/* 상태 칩 */
.a-chip { display: inline-flex; align-items: center; gap: 5px; font: 11px var(--a-mono); color: var(--a-dim); }
.a-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.a-chip.on { color: var(--a-cyan); } .a-chip.wait { color: var(--a-amber); } .a-chip.err { color: var(--a-red); } .a-chip.done { color: var(--a-green); }

/* 가는 진행 막대 (패널 안 영역별 수치) */
.a-bar { height: 3px; background: var(--a-line); border-radius: 2px; overflow: hidden; }
.a-bar > i { display: block; height: 100%; background: var(--a-cyan); box-shadow: 0 0 6px var(--a-cyan-dim); }
.a-bar.brass > i { background: var(--a-brass); box-shadow: none; }

/* 캔버스(2D 지도) 그릴 때 쓰는 값 — JS 에서 getComputedStyle 로 읽어 씀
   코어: 시안 구 + 황동 다이얼 고리(눈금 60개, 5개마다 길게)
   영역 노드: 황동 베젤 + 시안/호박 계기 바늘(진행률), 코어와 가는 시안 선
   연결선: 1px, var(--a-cyan) 35% */

@media (prefers-reduced-motion: reduce) { .a-bezel.on { box-shadow: 0 0 0 1px rgba(0,0,0,.5); } }
</style>

(function (g) {
  const C = { bg: '#050b14', cyan: '#3fe0ff', brass: '#c9a25a', brassHi: '#ecd29a', brassLo: '#7d5f2c', amber: '#f2a93b', red: '#ff6b6b', green: '#4fd18b', tx: '#d8e6f2', dim: '#7d93ab' };
  const stateCol = s => ({ on: C.cyan, wait: C.amber, err: C.red, done: C.green }[s] || C.dim);
  function brassRing(ctx, x, y, r, w) {
    const gr = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    gr.addColorStop(0, C.brassLo); gr.addColorStop(.35, C.brassHi); gr.addColorStop(.6, C.brass); gr.addColorStop(1, C.brassLo);
    ctx.strokeStyle = gr; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
  }
  function ticks(ctx, x, y, r, n, long, col, a) {
    ctx.strokeStyle = col; ctx.globalAlpha = a; ctx.lineWidth = 1;
    for (let i = 0; i < n; i++) { const an = i / n * 6.2832, l = i % long === 0 ? 6 : 3;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * r, y + Math.sin(an) * r); ctx.lineTo(x + Math.cos(an) * (r - l), y + Math.sin(an) * (r - l)); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function drawHubA(ctx, o) {
    const { cx, cy, R, t = 0, nodes = [], core = {} } = o;
    // 연결선
    for (const n of nodes) { ctx.strokeStyle = 'rgba(63,224,255,.28)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(n.x, n.y); ctx.stroke();
      ctx.fillStyle = C.cyan; ctx.globalAlpha = .7; const k = .62; ctx.beginPath(); ctx.arc(cx + (n.x - cx) * k, cy + (n.y - cy) * k, 1.6, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1; }
    // 코어: 시안 구 + 황동 다이얼
    const cr = R * .16, pulse = 1 + Math.sin(t / 900) * .03;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.9);
    glow.addColorStop(0, 'rgba(160,245,255,.95)'); glow.addColorStop(.35, 'rgba(63,224,255,.75)'); glow.addColorStop(.7, 'rgba(20,120,170,.25)'); glow.addColorStop(1, 'rgba(5,11,20,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, cr * 1.9 * pulse, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#071320'; ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(cx, cy, cr * 1.28, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;
    brassRing(ctx, cx, cy, cr * 1.42, cr * .16);
    brassRing(ctx, cx, cy, cr * 1.62, 1.2);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t / 60000); ticks(ctx, 0, 0, cr * 1.36, 60, 5, C.brassHi, .7); ctx.restore();
    if (core.label) { ctx.fillStyle = C.tx; ctx.textAlign = 'center'; ctx.font = `600 ${Math.max(11, cr * .26)}px ui-monospace,monospace`; ctx.fillText(core.label, cx, cy + cr * 1.62 + 18);
      if (core.sub) { ctx.fillStyle = C.dim; ctx.font = '10px ui-monospace,monospace'; ctx.fillText(core.sub, cx, cy + cr * 1.62 + 32); } }
    // 영역 노드: 황동 베젤 + 계기 바늘
    for (const n of nodes) {
      const col = stateCol(n.state);
      ctx.fillStyle = '#08131f'; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
      brassRing(ctx, n.x, n.y, n.r, 2.4);
      ticks(ctx, n.x, n.y, n.r - 3, 24, 6, C.brassHi, .45);
      // 진행 호 (아래쪽 열린 270°)
      const a0 = Math.PI * .75, a1 = a0 + Math.PI * 1.5 * Math.max(0, Math.min(1, n.p || 0));
      ctx.strokeStyle = 'rgba(125,147,171,.25)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * .68, a0, a0 + Math.PI * 1.5); ctx.stroke();
      ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * .68, a0, a1); ctx.stroke(); ctx.shadowBlur = 0;
      // 바늘
      ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n.x + Math.cos(a1) * n.r * .55, n.y + Math.sin(a1) * n.r * .55); ctx.stroke();
      ctx.fillStyle = C.brassHi; ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, 6.2832); ctx.fill();
      if (n.label) { ctx.fillStyle = C.tx; ctx.textAlign = 'center'; ctx.font = "12px 'Apple SD Gothic Neo',sans-serif"; ctx.fillText(n.label, n.x, n.y + n.r + 16);
        ctx.fillStyle = col; ctx.fillRect(n.x - 12, n.y + n.r + 21, 24, 1.5); }
    }
  }
  g.drawHubA = drawHubA; g.HUB_A_COLORS = C;
})(window);
</script>
<script>
const AREAS = [['공연·영업','on',.7],['정산','done',1],['홍보','on',.45],['영상','wait',.3],['아티스트','on',.6],['어린이클럽','idle',.1],['음악','err',.5],['운영','on',.8]];
const ICONS = ['mic','speaker','brain','home','hand','approve','inbox','mail','video','blog','music','clip','gear','sun','retry','warn','stage','coins','megaphone','camera','calendar','bell','chart','search','star','balloon','headphones','radar','lock','cloud','robot','doc','link','play','pause','power'];
const st = {on:'on',wait:'wait',err:'err',done:'done',idle:''};
document.getElementById('rows').innerHTML = AREAS.map(([n,s,p]) => `<div class="row"><span>${n}</span><div class="a-bar${s==='wait'?' brass':''}"><i style="width:${p*100}%"></i></div><span class="a-chip ${st[s]}">${Math.round(p*100)}</span></div>`).join('');
const showIcons = new URLSearchParams(location.search).has('icons');
if (showIcons) document.getElementById('icons').innerHTML = ICONS.map(i => `<span class="a-bezel" title="${i}"><svg class="ic"><use href="#i-${i}"/></svg></span>`).join('');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function frame(t) {
  const W = innerWidth, H = innerHeight, d = devicePixelRatio || 1;
  if (cv.width !== W * d) { cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, W, H);
  const narrow = W < 700, cx = W / 2 - (W > 900 ? 60 : 0), cy = narrow ? H * .62 : H / 2 + 20, R = narrow ? Math.min(W - 60, H * .45) * .4 : Math.min(W * .5, H - 140) * .38;
  const nodes = AREAS.map(([label, state, p], i) => { const a = -Math.PI / 2 + i / AREAS.length * 6.2832; return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, r: Math.max(20, R * .14), label, state, p }; });
  drawHubA(ctx, { cx, cy, R, t, nodes, core: { label: 'GRUNT', sub: 'WORKING 3/5' } });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
